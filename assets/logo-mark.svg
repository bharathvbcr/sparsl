<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="sparsl — compressed row walk · emerald">
  <title>sparsl — compressed row walk · emerald</title>
  <defs>
    <filter id="csglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="csclip"><rect x="6" y="6" width="116" height="116" rx="26"/></clipPath>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#050B09"/>
  <g clip-path="url(#csclip)">
    <!-- Structural zeros. Outlined, never filled: the format does not store them
         and the kernels never allocate or read them. -->
    <rect x="44" y="22" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="66" y="22" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="88" y="22" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="22" y="44" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="66" y="44" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="88" y="44" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="22" y="66" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="88" y="66" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="22" y="88" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="44" y="88" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>
    <rect x="66" y="88" width="18" height="18" rx="2.6" fill="#0A1310" stroke="#10B981" stroke-opacity="0.16" stroke-width="1.4"/>

    <!-- Stored entries. Row 2 carries two, so it takes a wider lane tier than
         the rows above and below it — the decision `RowKernel` makes per line. -->
    <rect x="22" y="22" width="18" height="18" rx="2.6" fill="#34D399" fill-opacity="0.95"/>
    <rect x="44" y="44" width="18" height="18" rx="2.6" fill="#34D399" fill-opacity="0.86"/>
    <rect x="44" y="66" width="18" height="18" rx="2.6" fill="#34D399" fill-opacity="0.95"/>
    <rect x="66" y="66" width="18" height="18" rx="2.6" fill="#34D399" fill-opacity="0.78"/>
    <rect x="88" y="88" width="18" height="18" rx="2.6" fill="#34D399" fill-opacity="0.86"/>

    <!-- The walk. Row-major over stored entries only, which is the order
         `col_indices` is laid out in and the order the lanes read it. -->
    <g filter="url(#csglow)">
      <path d="M31 31 L53 53 L53 75 L75 75 L97 97" fill="none" stroke="#DFFFF0"
            stroke-opacity="0.96" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31" cy="31" r="3.6" fill="#DFFFF0"/>
    </g>
  </g>
</svg>
