[package]
name = "sparsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Deterministic sparse + scan compute kernels for event-driven simulation, with fail-closed CPU/GPU backends"
repository = "https://github.com/bharathvbcr/sparsl"
readme = "README.md"
keywords = ["sparse", "spmv", "simd", "metal", "deterministic"]
categories = ["science", "algorithms", "hardware-support"]
license = "MIT OR Apache-2.0"

# The Metal backend is `cfg(all(target_os = "macos", feature = "metal"))`, so a
# default x86_64-linux docs build would render the crate with `Backend::Metal`
# permanently unavailable and `backend::metal` missing entirely — documenting
# the half of the crate that is not the interesting half.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
features = ["metal"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Native Metal compute on Apple silicon. Verified end-to-end against the CPU
# reference; see `Backend::Metal` and `tests/differential.rs`.
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
# Declares intent to build the CUDA backend. It does NOT make CUDA available:
# no dispatch is implemented, so `Backend::Cuda` stays unconstructible and says
# so. See `src/backend/cuda.rs` for why this is a feature and not a silent CPU
# fallback.
cuda = []

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# `objc2-metal`, not the gfx-rs `metal` crate. That line pulls `block 0.1.6` at
# every version including 0.33 (verified), which is unmaintained and trips the
# `static of uninhabited type` future-incompatibility lint — a hard error in a
# future Rust. objc2 has no such dependency, and the sibling `tessl` crate was
# already on it, so the two now share one binding stack.
#
# Features are listed rather than defaulted: each Metal class is its own
# feature, and naming them keeps the build honest about which parts of the API
# this backend actually touches.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString", "NSError"] }
objc2-metal = { version = "0.3", optional = true, features = [
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[dev-dependencies]
proptest = "1"

[[example]]
name = "scan_crossover"
required-features = ["metal"]

[[example]]
name = "f16_crossover"
required-features = ["metal"]

[[example]]
name = "crossover"
required-features = ["metal"]

[[example]]
name = "batch_crossover"
required-features = ["metal"]
