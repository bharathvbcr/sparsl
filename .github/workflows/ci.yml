name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:10 UTC daily, for the soak job below only.
    - cron: '10 5 * * *'

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CPU arms. These are the whole suite minus the Metal backend, and they are
  # not a reduced-value fallback: `available_backends()` simply returns fewer
  # arms, and every differential, stress, honesty and golden test runs against
  # the ones that remain.
  #
  # Linux is not here for portability box-ticking. `Backend::Metal` reports
  # itself unavailable on Linux, which means `try_new` takes its refusal path —
  # the exact branch that cannot be executed on a machine that has Metal, and
  # that a mutation campaign showed no test on such a machine can cover. This
  # job closes that gap.
  # ---------------------------------------------------------------------------
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (release)
        # Release, because the stress suite's soak and long-row cases are
        # impractically slow unoptimised.
        run: cargo test --release --all-targets
      - name: Doc tests
        # `--all-targets` silently excludes doc tests. Running them separately
        # is the only way they execute at all.
        run: cargo test --release --doc

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Metal, tested for real on a hosted runner.
  #
  # This job was originally written to build only, on the documented basis that
  # GitHub-hosted macOS runners expose no Metal device. That is out of date: on
  # `macos-26` arm64, `Device::try_new(Backend::Metal)` succeeds — it finds a
  # device, compiles the MSL library and builds all three pipeline states. The
  # workflow's own probe step is what caught it, by printing "ran on Metal GPU"
  # where the build-only assumption predicted a fallback to CPU.
  #
  # So the suite runs here. If a future runner image drops the device, this job
  # fails loudly rather than quietly skipping, because
  # `the_suite_actually_has_something_to_test` asserts that a macOS build
  # carrying the metal feature must find Metal available. That is the correct
  # failure: it means the GPU arm stopped being tested.
  # ---------------------------------------------------------------------------
  metal:
    name: metal / full suite
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Report which device this runner has
        run: cargo run --release --features metal --example readme
      - run: cargo clippy --features metal --all-targets -- -D warnings
      - name: Full suite with Metal
        run: cargo test --features metal --release --all-targets

  # ---------------------------------------------------------------------------
  # Bare-metal Apple silicon, for measurement rather than coverage.
  #
  # Correctness is covered by the hosted `metal` job above. What a hosted runner
  # cannot give is a trustworthy *number*: it is virtualised and shared, so
  # crossover timings from it would describe the runner, not the hardware anyone
  # runs this on.
  #
  # Gated on a repository variable rather than merely targeting `self-hosted`,
  # because a job whose runner labels match nothing queues indefinitely instead
  # of skipping. Set `HAS_METAL_RUNNER` to `true` under
  # Settings → Secrets and variables → Actions → Variables once a runner is
  # registered.
  # ---------------------------------------------------------------------------
  metal-bench:
    name: metal / crossover measurement on bare metal
    if: ${{ vars.HAS_METAL_RUNNER == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features metal --release --all-targets
      - name: Crossover measurement
        # Not a gate — the numbers land in the job log so a regression in the
        # CPU/GPU crossover is visible without anyone running it by hand.
        run: cargo run --release --features metal --example crossover

  # ---------------------------------------------------------------------------
  # Cargo.toml claims `rust-version = "1.82"`. Unverified, that is just a string
  # in a manifest, so this builds against exactly that toolchain.
  #
  # Two deliberate flags, both load-bearing:
  #
  # `--locked` — without it, Cargo 1.82 re-resolves and pulls a `getrandom` that
  # needs `edition2024`, failing on a dependency rather than on this crate. The
  # MSRV claim is about building the shipped lockfile, so the lockfile is what
  # gets built.
  #
  # NOT `--all-targets` — that pulls dev-dependencies, and `proptest` declares
  # `rust-version = 1.85`. The test suite genuinely needs a newer toolchain than
  # the library does. `rust-version` is a promise to consumers of the library,
  # who never build the tests, so this checks what the promise actually covers.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV 1.82 (library)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      - run: cargo check --locked --features metal

  # ---------------------------------------------------------------------------
  # Soak. Scheduled and manual only — too slow for every push.
  #
  # The per-push fuzz runs 48 random shapes so it stays fast. That is enough to
  # catch a broken kernel and nowhere near enough to trust the tail. This runs
  # 50,000, and repeats the whole suite to catch anything intermittent: the
  # concurrency test and the GPU dispatch paths are where a flake would hide,
  # and a flake that appears once in fifty runs is a real defect, not noise.
  # ---------------------------------------------------------------------------
  soak:
    name: soak (scheduled)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Differential fuzz, 50k random shapes
        env:
          PROPTEST_CASES: 50000
        run: cargo test --features metal --release --test differential
      - name: Repeat the full suite to surface intermittents
        run: |
          for i in $(seq 1 12); do
            echo "::group::run $i"
            cargo test --features metal --release --all-targets
            echo "::endgroup::"
          done
