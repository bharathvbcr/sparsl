name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:10 UTC daily, for the soak job below only.
    - cron: '10 5 * * *'

env:
  CARGO_TERM_COLOR: always

# A newer interactive branch run supersedes its predecessor. Scheduled soaks
# use a separate group and are never cancelled by a push or by another event.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ---------------------------------------------------------------------------
  # CPU arms. These are the whole suite minus the Metal backend, and they are
  # not a reduced-value fallback: `available_backends()` simply returns fewer
  # arms, and every differential, stress, honesty and golden test runs against
  # the ones that remain.
  #
  # Linux is not here for portability box-ticking. `Backend::Metal` reports
  # itself unavailable on Linux, which means `try_new` takes its refusal path —
  # the exact branch that cannot be executed on a machine that has Metal, and
  # that a mutation campaign showed no test on such a machine can cover. This
  # job closes that gap.
  # ---------------------------------------------------------------------------
  test:
    name: test / ${{ matrix.os }}
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (release)
        # Release, because the stress suite's soak and long-row cases are
        # impractically slow unoptimised.
        run: cargo test --release --all-targets
      - name: Doc tests
        # `--all-targets` silently excludes doc tests. Running them separately
        # is the only way they execute at all.
        run: cargo test --release --doc

  lint:
    name: fmt + clippy
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Docs build clean (linux, no metal feature)
        # Three public doc comments linked private items; one named
        # `SparseOp::prepare`, which exists but is crate-private — the public
        # entry point is `Device::prepare`. `-D warnings` keeps that at zero.
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ---------------------------------------------------------------------------
  # Metal, tested for real on a hosted runner.
  #
  # This job was originally written to build only, on the documented basis that
  # GitHub-hosted macOS runners expose no Metal device. That is out of date: on
  # `macos-26` arm64, `Device::try_new(Backend::Metal)` succeeds — it finds a
  # device, compiles the MSL library and builds all eleven pipeline states. The
  # workflow's own probe step is what caught it, by printing "ran on Metal GPU"
  # where the build-only assumption predicted a fallback to CPU.
  #
  # So the suite runs here. If a future runner image drops the device, this job
  # fails loudly rather than quietly skipping, because
  # `the_suite_actually_has_something_to_test` asserts that a macOS build
  # carrying the metal feature must find Metal available. That is the correct
  # failure: it means the GPU arm stopped being tested.
  # ---------------------------------------------------------------------------
  metal:
    name: metal / full suite
    if: ${{ github.event_name != 'schedule' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Report which device this runner has
        run: cargo run --release --features metal --example readme
      - run: cargo clippy --features metal --all-targets -- -D warnings
      - name: Docs build clean (with the metal feature)
        # `[package.metadata.docs.rs]` renders this crate for
        # aarch64-apple-darwin with `metal` on, so that configuration is the one
        # readers see. It is only checkable on a macOS runner.
        run: cargo doc --no-deps --features metal
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Full suite with Metal
        # Serialize GPU work and keep Apple's shader validator fail-closed. The
        # same configuration is used by the local 4,096-case qualification run.
        run: cargo test --features metal --release --all-targets -- --test-threads=1
        env:
          MTL_SHADER_VALIDATION: "1"
          MTL_SHADER_VALIDATION_REPORT_TO_STDERR: "1"
          MTL_SHADER_VALIDATION_ABORT_ON_FAULT: "1"

  # ---------------------------------------------------------------------------
  # Bare-metal Apple silicon, for measurement rather than coverage.
  #
  # Correctness is covered by the hosted `metal` job above. What a hosted runner
  # cannot give is a trustworthy *number*: it is virtualised and shared, so
  # crossover timings from it would describe the runner, not the hardware anyone
  # runs this on.
  #
  # Gated on a repository variable rather than merely targeting `self-hosted`,
  # because a job whose runner labels match nothing queues indefinitely instead
  # of skipping. Set `HAS_METAL_RUNNER` to `true` under
  # Settings → Secrets and variables → Actions → Variables once a runner is
  # registered.
  # ---------------------------------------------------------------------------
  metal-bench:
    name: metal / crossover measurement on bare metal
    if: ${{ github.event_name != 'schedule' && vars.HAS_METAL_RUNNER == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features metal --release --all-targets -- --test-threads=1
      - name: Crossover measurement
        # Not a gate — the numbers land in the job log so a regression in the
        # CPU/GPU crossover is visible without anyone running it by hand. Each
        # command is correctness-gated and prints its own source/host provenance.
        run: |
          cargo run --locked --release --features metal --example crossover
          cargo run --locked --release --features metal --example narrow_crossover
          cargo run --locked --release --features metal --example spike_crossover
          cargo run --locked --release --features metal --example scan_crossover
          cargo run --locked --release --features metal --example batch_crossover

  # ---------------------------------------------------------------------------
  # Cargo.toml claims `rust-version = "1.82"`. Unverified, that is just a string
  # in a manifest, so this builds against exactly that toolchain.
  #
  # Two deliberate flags, both load-bearing:
  #
  # `--locked` is load-bearing: the bounded property-test dependency is pinned
  # to the final rand-0.8 line, avoiding a target-only edition-2024 manifest
  # that Cargo 1.82 cannot parse. Metadata is checked explicitly because a
  # host-target build can skip parsing an unused target dependency. Unlike the
  # old gate, the compile checks include every target and dev-dependency.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV 1.82 / locked graph + all targets
    if: ${{ github.event_name != 'schedule' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-features --all-targets

  # ---------------------------------------------------------------------------
  # Soak. Scheduled and manual only — too slow for every push.
  #
  # The per-push multi-operation fuzz runs 48 generated cases so it stays fast,
  # choosing one of nine operation families per case; a deterministic sentinel
  # still executes every family. That is enough to catch a broken kernel and
  # nowhere near enough to trust the tail. This runs 50,000 total randomized
  # operations (not 50,000 of each), and repeats the whole suite to catch
  # anything intermittent: the concurrency test and the GPU dispatch paths are
  # where a flake would hide, and a flake that appears once in fifty runs is a
  # real defect, not noise.
  # ---------------------------------------------------------------------------
  soak:
    name: soak (scheduled)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Differential fuzz, 50k randomized operations and shapes
        env:
          PROPTEST_CASES: 50000
          MTL_SHADER_VALIDATION: "1"
          MTL_SHADER_VALIDATION_REPORT_TO_STDERR: "1"
          MTL_SHADER_VALIDATION_ABORT_ON_FAULT: "1"
        run: cargo test --features metal --release --test differential -- --test-threads=1
      - name: Repeat the full suite to surface intermittents
        run: |
          for i in $(seq 1 12); do
            echo "::group::run $i"
            MTL_SHADER_VALIDATION=1 \
              MTL_SHADER_VALIDATION_REPORT_TO_STDERR=1 \
              MTL_SHADER_VALIDATION_ABORT_ON_FAULT=1 \
              cargo test --features metal --release --all-targets -- --test-threads=1
            echo "::endgroup::"
          done
